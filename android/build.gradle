// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// METEVO: the @utexo RLN staging hook was removed. The wallet runs in
// remote mode (plain HTTP to the regtest node), so the on-device RLN Bare
// addon is not packaged; bare-kit's own link step stages the QVAC addons
// the voice worklet needs (see qvac/addons.manifest.json).
