// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// On-device RLN: stage the @utexo Bare addon into the APK so the wallet
// worklet can load it from nativeLibraryDir. The hook pins bare-kit 0.15.5.
ext.utexoBarePackageDir = "$rootDir/../node_modules/@utexo/rgb-lightning-node-bare"
apply from: "$rootDir/../node_modules/@utexo/rgb-lightning-node-bare/android/staging.gradle"
