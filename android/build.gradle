// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// METEVO: stage the RLN Bare addon per the upstream Android integration
// (verifies the original prebuild and copies it byte-for-byte for Bare's
// linked: resolver; bare-link's ELF rewrite must not ship it).
def rlnBareManifest = providers.exec {
    workingDir rootDir.parentFile
    commandLine 'node', '--print', "require.resolve('@utexo/rgb-lightning-node-bare/package.json')"
}.standardOutput.asText.get().trim()
ext.utexoBarePackageDir = new File(rlnBareManifest).parentFile
apply from: new File(utexoBarePackageDir, 'android/staging.gradle')
